<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="favNavyAitm" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#081A30" />
      <stop offset="60%" stopColor="#0C2C55" />
      <stop offset="100%" stopColor="#19426D" />
    </linearGradient>
    <linearGradient id="favCyanAitm" x1="15" y1="105" x2="105" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0284C7" />
      <stop offset="50%" stopColor="#00D2FF" />
      <stop offset="100%" stopColor="#38BDF8" />
    </linearGradient>
    <linearGradient id="favGoldAitm" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FDE68A" />
      <stop offset="100%" stopColor="#D97706" />
    </linearGradient>
  </defs>

  <!-- Aerodynamic Shield Background -->
  <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#favNavyAitm)" stroke="#00D2FF" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- "M" Swept Wings Base -->
  <path d="M 22 84 L 38 44 L 52 64 L 40 84 Z" fill="#13365E" />
  <path d="M 98 84 L 82 44 L 68 64 L 80 84 Z" fill="url(#favCyanAitm)" opacity="0.85" />
  <path d="M 24 84 L 96 84" stroke="url(#favGoldAitm)" stroke-width="3" stroke-linecap="round" />

  <!-- "A" Delta Supersonic Aircraft -->
  <g>
    <path d="M 60 16 L 36 74 L 57 65 Z" fill="#081A30" stroke="#00D2FF" stroke-width="0.8" />
    <path d="M 60 16 L 57 65 L 84 74 Z" fill="url(#favCyanAitm)" />
    <path d="M 60 16 L 58 66 L 60 72 L 62 66 Z" fill="#FFFFFF" />
    <circle cx="60" cy="16" r="3.2" fill="#FFFFFF" />
    <circle cx="60" cy="16" r="1.8" fill="url(#favGoldAitm)" />
    <path d="M 55 68 L 60 84 L 65 68 Z" fill="url(#favCyanAitm)" opacity="0.9" />
  </g>

  <!-- Gold & Cyan Coordinates -->
  <circle cx="36" cy="74" r="2.5" fill="url(#favGoldAitm)" />
  <circle cx="84" cy="74" r="2.5" fill="#00D2FF" />
</svg>