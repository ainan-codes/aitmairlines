<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="favNavy" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#08182B" />
      <stop offset="50%" stopColor="#0C2C55" />
      <stop offset="100%" stopColor="#173D68" />
    </linearGradient>
    <linearGradient id="favCyan" x1="10" y1="110" x2="110" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0284C7" />
      <stop offset="45%" stopColor="#00D2FF" />
      <stop offset="100%" stopColor="#38BDF8" />
    </linearGradient>
    <linearGradient id="favTraj" x1="15" y1="105" x2="105" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0284C7" stopOpacity="0.2" />
      <stop offset="50%" stopColor="#00D2FF" />
      <stop offset="100%" stopColor="#10B981" />
    </linearGradient>
  </defs>

  <!-- Hex-Shield Background -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#favNavy)" stroke="#00D2FF" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Radar Coordinates -->
  <circle cx="60" cy="60" r="44" stroke="#00D2FF" stroke-width="1" stroke-dasharray="3 5" stroke-opacity="0.25" />

  <!-- Trajectory Arc -->
  <path d="M 22 94 C 36 94, 48 80, 60 60 C 72 40, 86 26, 98 18" stroke="url(#favTraj)" stroke-width="5" stroke-linecap="round" />

  <!-- Supersonic Delta Jet -->
  <g>
    <!-- Left Wing -->
    <path d="M 60 18 L 36 78 L 57 68 Z" fill="#08182B" stroke="#00D2FF" stroke-width="0.8" />
    <!-- Right Wing -->
    <path d="M 60 18 L 57 68 L 84 78 Z" fill="url(#favCyan)" />
    <!-- Titanium Spine -->
    <path d="M 60 18 L 58 69 L 60 75 L 62 69 Z" fill="#FFFFFF" />
    <!-- Jet Flare -->
    <path d="M 55 72 L 60 90 L 65 72 Z" fill="url(#favTraj)" opacity="0.9" />
    <!-- Nose Apex -->
    <circle cx="60" cy="18" r="3.5" fill="#FFFFFF" />
  </g>

  <!-- Metric Nodes -->
  <circle cx="60" cy="60" r="3.5" fill="#00D2FF" />
  <circle cx="90" cy="24" r="4.5" fill="#10B981" />
</svg>