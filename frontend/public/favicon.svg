<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="fxGrad" x1="0" y1="100" x2="100" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0C2C55" />
      <stop offset="60%" stopColor="#1E4A5C" />
      <stop offset="100%" stopColor="#06B6D4" />
    </linearGradient>
    <linearGradient id="fxX" x1="15" y1="85" x2="85" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#06B6D4" stopOpacity="0.4" />
      <stop offset="100%" stopColor="#10B981" />
    </linearGradient>
    <linearGradient id="fxWing" x1="20" y1="20" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38BDF8" />
      <stop offset="60%" stopColor="#06B6D4" />
      <stop offset="100%" stopColor="#0C2C55" />
    </linearGradient>
  </defs>

  <!-- Background rounded badge -->
  <rect width="100" height="100" rx="22" fill="#0C2C55" />

  <!-- Outer Orbit & X-Intersection Guides -->
  <circle cx="50" cy="50" r="42" stroke="#06B6D4" stroke-width="1.6" stroke-dasharray="3 4" stroke-opacity="0.4" />
  <path d="M 22 22 L 78 78" stroke="#06B6D4" stroke-width="2" stroke-linecap="round" stroke-opacity="0.3" />
  
  <!-- Index Trajectory Curve (FareX Dynamic Ascent) -->
  <path d="M 20 78 C 30 78, 42 66, 50 50 C 58 34, 70 22, 84 16" stroke="url(#fxX)" stroke-width="3.5" stroke-linecap="round" />

  <!-- Supersonic Delta Jet Silhouette -->
  <g>
    <!-- Left Wing -->
    <path d="M 50 14 L 32 66 L 47 57 Z" fill="#06B6D4" />
    <!-- Right Wing (High Accent) -->
    <path d="M 50 14 L 47 57 L 68 66 Z" fill="url(#fxWing)" />
    <!-- Titanium Ridge Line -->
    <path d="M 50 14 L 48 58 L 50 63 L 52 58 Z" fill="#FFFFFF" />
    <!-- Apex Beacon Point -->
    <circle cx="50" cy="14" r="3" fill="#38BDF8" />
    <!-- Thrust Flame -->
    <path d="M 46 60 L 50 74 L 54 60 Z" fill="#10B981" opacity="0.85" />
  </g>

  <!-- Metric Beacon Nodes -->
  <circle cx="50" cy="50" r="3" fill="#06B6D4" />
  <circle cx="76" cy="22" r="3.8" fill="#10B981" />
</svg>