<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="favGrad" x1="10" y1="90" x2="90" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0C2C55" />
      <stop offset="60%" stopColor="#1E4A5C" />
      <stop offset="100%" stopColor="#06B6D4" />
    </linearGradient>
    <linearGradient id="favWing" x1="20" y1="20" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38BDF8" />
      <stop offset="50%" stopColor="#06B6D4" />
      <stop offset="100%" stopColor="#0C2C55" />
    </linearGradient>
    <linearGradient id="favArc" x1="10" y1="85" x2="85" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#06B6D4" stopOpacity="0.3" />
      <stop offset="100%" stopColor="#10B981" />
    </linearGradient>
  </defs>

  <!-- Background rounded badge -->
  <rect width="100" height="100" rx="22" fill="#0C2C55" />

  <!-- Radar & Coordinate Circles -->
  <circle cx="50" cy="50" r="40" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="3 4" stroke-opacity="0.4" />
  
  <!-- Index Growth Arc -->
  <path d="M 20 78 C 30 78, 42 66, 52 50 C 62 34, 74 24, 84 18" stroke="url(#favArc)" stroke-width="3" stroke-linecap="round" />

  <!-- Supersonic Aircraft -->
  <g>
    <!-- Left Wing -->
    <path d="M 50 16 L 33 66 L 47 57 Z" fill="#06B6D4" />
    <!-- Right Wing -->
    <path d="M 50 16 L 47 57 L 67 66 Z" fill="url(#favWing)" />
    <!-- Center Fuselage Spine -->
    <path d="M 50 16 L 48 58 L 50 63 L 52 58 Z" fill="#FFFFFF" />
    <!-- Jet Apex Point -->
    <circle cx="50" cy="16" r="3" fill="#38BDF8" />
    <!-- Thrust Glow -->
    <path d="M 46 60 L 50 74 L 54 60 Z" fill="#10B981" opacity="0.8" />
  </g>

  <!-- Metric Beacon Dots -->
  <circle cx="52" cy="50" r="3" fill="#06B6D4" />
  <circle cx="78" cy="24" r="3.5" fill="#10B981" />
</svg>